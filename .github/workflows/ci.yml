name: CI

# The three agent-safe gates (pnpm test / typecheck / build) — no Electron
# launch (e2e is manual, per docs/uat-checklist.md). Skipping the Electron
# binary download keeps runs fast: tests/build never execute the binary.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version read from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test (Vitest — incl. real node-pty + bash shell-init integration)
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (main + preload + renderer, no launch)
        run: pnpm build
